name: Validate native workflow

on:
  push:
    branches:
      - refactor/devenv-mysql
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Verify formatting
        run: |
          nix fmt
          git diff --exit-code

      - name: Check pure flake
        run: nix flake check

      - name: Test Markdown and MySQL workflow
        run: |
          nix develop -c bash -euc '
            command -v mysql
            command -v mysql-services
            command -v fmt
            command -v chk

            cat > markdown-test.md <<"MD"
            # Markdown test   

            This deliberately very long Markdown line is well beyond eighty characters and must remain valid because the Hot Wheels policy disables MD013 line-length enforcement.

            ```makefile
            target:
            	@echo ok
            ```
            MD
            nix fmt -- markdown-test.md
            rm markdown-test.md

            [[ "$MYSQL_UNIX_PORT" == /tmp/isys2014-*/mysql.sock ]]
            mysql-services up --detached
            trap "mysql-services down >/dev/null 2>&1 || true" EXIT
            timeout 30 mysql-services project is-ready --wait >/dev/null
            test "$(mysql -u root -Nse "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"dswork\"")" = dswork

            printf "%s\n" "CREATE TABLE smoke_test (id INT);" >/tmp/isys2014-smoke.sql
            mysql -u root dswork -e "source /tmp/isys2014-smoke.sql;"
            test "$(mysql -u root dswork -Nse "SHOW TABLES LIKE \"smoke_test\";")" = smoke_test
          '

      - name: Check diff
        run: git diff --check
