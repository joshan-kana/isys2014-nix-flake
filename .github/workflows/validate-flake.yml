name: Validate flake

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Validate flake
        run: |
          nix fmt
          git diff --exit-code
          nix flake check

          nix develop -c bash -euc '
            command -v fmt
            command -v chk
            command -v mysql
            ! command -v mysql-services
            mysql -u root -Nse "USE dswork"

            cp flake.nix /tmp/flake.nix.clean
            printf "\nthis is not valid nix\n" >> flake.nix
            chk
            cp /tmp/flake.nix.clean flake.nix

            printf "\nthis is not valid nix\n" >> flake.nix
            git add flake.nix
            if chk; then
              echo "ERROR: chk ignored an invalid staged flake.nix" >&2
              exit 1
            fi
            git reset -- flake.nix
            cp /tmp/flake.nix.clean flake.nix
            git diff --exit-code
          '

          services="$(nix build .#checks.x86_64-linux.services --no-link --print-out-paths)"
          "$services/bin/mysql-services" process stop mysql
          nix develop -c mysql -u root -Nse "USE dswork"
