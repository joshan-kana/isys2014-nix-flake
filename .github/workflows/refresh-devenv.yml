name: Validate devenv migration

on:
  push:
    branches:
      - refactor/devenv-mysql

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Refresh lock file
        run: nix flake lock

      - name: Format
        run: nix fmt

      - name: Check flake
        run: nix flake check --impure

      - name: Test MySQL workflow
        run: |
          nix develop --no-pure-eval --command bash -euc '
            trap "devenv down >/dev/null 2>&1 || true" EXIT
            db-start
            test "$(mysql -u root -Nse "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"dswork\"")" = dswork
          '

      - name: Check diff
        run: git diff --check

      - name: Commit generated lock and formatting
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add flake.lock flake.nix devenv.nix
            git commit -m "chore: refresh devenv lock and formatting"
            git push
          fi
