name: Validate automatic MySQL

on:
  push:
    branches:
      - refactor/devenv-mysql
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Verify formatting
        run: |
          nix fmt
          git diff --exit-code

      - name: Check pure flake
        run: nix flake check

      - name: Test automatic MySQL management
        run: |
          nix develop -c bash -euc '
            command -v mysql
            ! command -v mysql-services
            [[ "$MYSQL_UNIX_PORT" == /tmp/isys2014-*/mysql.sock ]]
            test -S "$MYSQL_UNIX_PORT"
            mysql -u root -Nse "USE dswork"
            mysql -u root dswork -e "CREATE TABLE activation_test (id INT);"
          '

          nix develop -c bash -euc '
            ! command -v mysql-services
            mysql -u root -Nse "USE dswork"
            test "$(mysql -u root dswork -Nse "SHOW TABLES LIKE \"activation_test\";")" = activation_test
          '

      - name: Check diff
        run: git diff --check
