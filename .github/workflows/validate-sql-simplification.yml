name: Validate SQL simplification

on:
  push:
    branches:
      - refactor/devenv-mysql

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Format
        run: |
          nix fmt
          git diff --exit-code

      - name: Check pure flake
        run: nix flake check

      - name: Test SQL tooling and MySQL
        run: |
          nix develop -c bash -euc '
            trap db-stop EXIT

            cat >/tmp/client.sql <<"SQL"
            select 1;
            source setup.sql;
            SQL
            sqlfmt /tmp/client.sql
            sqllint /tmp/client.sql
            grep -Eiq "^[[:space:]]*source[[:space:]]+setup\\.sql;" /tmp/client.sql

            [[ "$MYSQL_UNIX_PORT" == /tmp/isys2014-*/mysql.sock ]]
            db-start
            test "$(mysql -u root -Nse "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"dswork\"")" = dswork

            printf "%s\n" "CREATE TABLE smoke_test (id INT);" >/tmp/smoke.sql
            db-run /tmp/smoke.sql
            test "$(mysql -u root dswork -Nse "SHOW TABLES LIKE \"smoke_test\";")" = smoke_test

            db-reset
            test -z "$(mysql -u root dswork -Nse "SHOW TABLES LIKE \"smoke_test\";")"
          '

      - name: Check diff
        run: git diff --check
