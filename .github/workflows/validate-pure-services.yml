name: Validate pure services migration

on:
  push:
    branches:
      - refactor/devenv-mysql
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: cachix/install-nix-action@v31

      - name: Refresh lock file
        run: nix flake lock

      - name: Format
        run: nix fmt

      - name: Check pure flake
        run: nix flake check

      - name: Test pure development shell and MySQL workflow
        run: |
          nix develop -c bash -euc '
            trap db-stop EXIT

            command -v db
            command -v sqlfmt
            command -v sqllint
            command -v fmt
            command -v lt
            command -v chk

            if ! db-start; then
              find "${TMPDIR:-/tmp}" -name process-compose-runner.log -print -exec cat {} \; 2>/dev/null || true
              exit 1
            fi
            test "$(mysql -u root -Nse "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"dswork\"")" = dswork

            printf "%s\n" "CREATE TABLE smoke_test (id INT);" > /tmp/isys2014-smoke.sql
            db-run /tmp/isys2014-smoke.sql
            test "$(mysql -u root dswork -Nse "SHOW TABLES LIKE \"smoke_test\";")" = smoke_test

            db-reset
            test "$(mysql -u root -Nse "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"dswork\"")" = dswork
            test -z "$(mysql -u root dswork -Nse "SHOW TABLES LIKE \"smoke_test\";")"
          '

      - name: Check diff
        run: git diff --check

      - name: Commit generated lock and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.nix flake.lock README.md .envrc .gitignore .vscode
          git commit -m 'chore: refresh pure service environment'
          git pull --rebase origin refactor/devenv-mysql
          git push origin HEAD:refactor/devenv-mysql
