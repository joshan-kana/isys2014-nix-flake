name: Validate runtime cleanup

on:
  push:
    branches:
      - refactor/devenv-mysql
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Verify formatting
        run: |
          nix fmt
          git diff --exit-code

      - name: Check pure flake
        run: nix flake check

      - name: Test nested MySQL workflow
        run: |
          nix develop -c bash -euc '
            root="$PWD"
            mkdir -p nested/work
            cd nested/work

            test "$ISYS2014_ROOT" = "$root"
            [[ "$MYSQL_UNIX_PORT" == /tmp/isys2014-*/mysql.sock ]]

            mysql-services up --detached
            trap "mysql-services down >/dev/null 2>&1 || true" EXIT
            timeout 30 mysql-services project is-ready --wait >/dev/null

            test "$(mysql -u root -Nse "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"dswork\"")" = dswork
            test -S "$MYSQL_UNIX_PORT"
            test -S "${ISYS2014_RUN_DIR}/process-compose.sock"
          '

      - name: Check diff
        run: git diff --check
