name: Validate simplified flake

on:
  push:
    branches:
      - refactor/devenv-mysql
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Verify formatting
        run: |
          nix fmt
          git diff --exit-code

      - name: Check pure flake
        run: nix flake check

      - name: Test shell and database commands
        run: |
          nix develop -c bash -euc '
            trap db-stop EXIT

            command -v db
            command -v db-start
            command -v db-run
            command -v db-reset
            command -v db-stop
            command -v db-status
            command -v db-log
            command -v fmt
            command -v chk

            printf "%s\n" "select 1;" > scoped.sql
            nix fmt -- scoped.sql
            rm scoped.sql

            [[ "$MYSQL_UNIX_PORT" == /tmp/isys2014-*/mysql.sock ]]
            (( ${#MYSQL_UNIX_PORT} < 100 ))

            db-start
            db-start
            db-status >/dev/null
            test "$(mysql -u root -Nse "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"dswork\"")" = dswork

            printf "%s\n" "CREATE TABLE smoke_test (id INT);" >/tmp/isys2014-smoke.sql
            db-run /tmp/isys2014-smoke.sql
            test "$(mysql -u root dswork -Nse "SHOW TABLES LIKE \"smoke_test\";")" = smoke_test

            db-reset
            test "$(mysql -u root -Nse "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"dswork\"")" = dswork
            test -z "$(mysql -u root dswork -Nse "SHOW TABLES LIKE \"smoke_test\";")"
          '

      - name: Check diff
        run: git diff --check
