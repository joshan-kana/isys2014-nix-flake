name: Validate staged chk

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Verify formatting and flake
        run: |
          nix fmt
          git diff --exit-code
          nix flake check

      - name: Verify chk uses staged files
        run: |
          nix develop -c bash -euc '
            git config user.name ci
            git config user.email ci@example.invalid

            cp flake.nix /tmp/flake.nix.clean
            printf "\nthis is not valid nix\n" >> flake.nix
            chk
            cp /tmp/flake.nix.clean flake.nix

            printf "\nthis is not valid nix\n" >> flake.nix
            git add flake.nix
            if chk; then
              echo "ERROR: chk ignored an invalid staged flake.nix" >&2
              exit 1
            fi
            git reset -- flake.nix
            cp /tmp/flake.nix.clean flake.nix

            git diff --exit-code
          '
